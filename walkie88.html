<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Estilo WhatsApp</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }
    .radio-box {
      background: #181b22;
      border: 1px solid #2b313d;
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .status {
      font-size: 13px;
      color: #4CAF50;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    
    /* Botón Estilo Micrófono WhatsApp */
    .mic-btn-container {
      position: relative;
      margin: 20px 0;
    }
    #micBtn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #2b313d;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      outline: none;
      transition: transform 0.1s, background 0.2s;
      margin: 0 auto;
    }
    #micBtn.recording {
      background: linear-gradient(135deg, #ff5252, #c62828);
      box-shadow: 0 0 25px rgba(255, 82, 82, 0.8);
      transform: scale(1.1);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1.08); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1.08); }
    }

    .hint {
      font-size: 11px;
      color: #8c96a5;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .btn-play {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2196F3;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-play:disabled {
      background: #2b313d;
      color: #6b7280;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="radio-box">
    <h3>PRIMO-PTT</h3>
    <div class="status" id="statusText">Iniciando sistema...</div>

    <input type="text" id="username" value="Usuario-1" style="display:none;">

    <!-- Botón WhatsApp: Mantén presionado para hablar, suelta para enviar -->
    <div class="mic-btn-container">
      <button id="micBtn" title="Mantén presionado para hablar">🎙️</button>
    </div>
    <div class="hint" id="hintText">Mantén presionado para grabar</div>

    <hr style="border-color: #2b313d; margin: 25px 0;">

    <p style="font-size: 11px; color: #8c96a5; text-transform: uppercase;">Mensaje Entrante (RX)</p>
    <input type="text" id="remitente"  placeholder="De: Nadie" style="width: 100%; padding: 8px; background: #0a0c10; border: 1px solid #2b313d; color: #fff; border-radius: 6px; text-align: center; margin-bottom: 8px; font-size: 12px;">
    
    <button class="btn-play" id="playBtn" disabled>🔊 Reproducir Nota de Voz</button>
  </div>
