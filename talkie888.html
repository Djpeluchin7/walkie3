<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Estilo WhatsApp</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }
    .radio-box {
      background: #181b22;
      border: 1px solid #2b313d;
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .status {
      font-size: 13px;
      color: #4CAF50;
      margin-bottom: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    
    /* Botón Estilo Micrófono WhatsApp */
    .mic-btn-container {
      position: relative;
      margin: 20px 0;
    }
    #micBtn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #2b313d;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      outline: none;
      transition: transform 0.1s, background 0.2s;
      margin: 0 auto;
    }
    #micBtn.recording {
      background: linear-gradient(135deg, #ff5252, #c62828);
      box-shadow: 0 0 25px rgba(255, 82, 82, 0.8);
      transform: scale(1.1);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1.08); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1.08); }
    }

    .hint {
      font-size: 11px;
      color: #8c96a5;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .btn-play {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2196F3;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-play:disabled {
      background: #2b313d;
      color: #6b7280;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="radio-box">
    <h3>💬 WHATS-PTT</h3>
    <div class="status" id="statusText">Iniciando sistema...</div>

    <input type="text" id="username" value="Usuario-1" style="display:none;">

    <!-- Botón WhatsApp: Mantén presionado para hablar, suelta para enviar -->
    <div class="mic-btn-container">
      <button id="micBtn" title="Mantén presionado para hablar">🎙️</button>
    </div>
    <div class="hint" id="hintText">Mantén presionado para grabar</div>

    <hr style="border-color: #2b313d; margin: 25px 0;">

    <p style="font-size: 11px; color: #8c96a5; text-transform: uppercase;">Mensaje Entrante (RX)</p>
    <input type="text" id="remitente" readonly placeholder="De: Nadie" style="width: 100%; padding: 8px; background: #0a0c10; border: 1px solid #2b313d; color: #fff; border-radius: 6px; text-align: center; margin-bottom: 8px; font-size: 12px;">
    
    <button class="btn-play" id="playBtn" disabled>🔊 Reproducir Nota de Voz</button>
  </div>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgXtkxdvhx4dfsPvWcTK7pCYwnp5Cq392pR0Egp_Xjo4ByfVkDM4OmVwgI7OJ0-XTc/exec";
    
    // 🎵 SONIDO DE NOTIFICACIÓN (Puedes cambiar esta URL por el sonido que prefieras)
    const notificationSound = new Audio("https://mixkit.co");

    let mediaRecorder;
    let audioChunks = [];
    let lastAudioBase64 = "";
    
    const statusText = document.getElementById('statusText');
    const hintText = document.getElementById('hintText');
    const micBtn = document.getElementById('micBtn');
    const playBtn = document.getElementById('playBtn');
    const remitenteInput = document.getElementById('remitente');

    // Inicializar el micrófono al cargar la página
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          
          reader.onloadend = () => {
            const base64Audio = reader.result;
            enviarAudioASheets(base64Audio);
          };
          audioChunks = [];
        };

        statusText.innerText = "Listo para hablar";
      })
      .catch(err => {
        console.error("Error de micrófono:", err);
        statusText.innerText = "Error: Permiso de micrófono requerido";
        statusText.style.color = "#ef4444";
      });

    // Eventos estilo WhatsApp (Soporta táctil en celular y mouse en PC)
    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);

    micBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startRecording();
    });
    micBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopRecording();
    });

    function startRecording() {
      if (!mediaRecorder || mediaRecorder.state === "recording") return;
      audioChunks = [];
      mediaRecorder.start();
      micBtn.classList.add('recording');
      hintText.innerText = "Grabando nota de voz...";
      statusText.innerText = "🔴 Grabando...";
      statusText.style.color = "#ff5252";
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      hintText.innerText = "Mantén presionado para grabar";
      statusText.innerText = "Enviando nota de voz...";
      statusText.style.color = "#4CAF50";
    }

    // Enviar la nota de voz en Base64 a Google Sheets
    function enviarAudioASheets(base64Data) {
      const user = document.getElementById('username').value || "Anónimo";

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user, audio: base64Data })
      }).then(() => {
        statusText.innerText = "¡Nota de voz enviada!";
        setTimeout(() => {
          statusText.innerText = "Listo para hablar";
        }, 2000);
      }).catch(err => {
        console.error(err);
        statusText.innerText = "Error al enviar";
        statusText.style.color = "#ef4444";
      });
    }

    // Polling periódico para buscar nuevos audios entrantes en Google Sheets
    setInterval(async () => {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data && data.audio && data.audio !== lastAudioBase64) {
          lastAudioBase64 = data.audio;
          remitenteInput.value = "De: " + (data.user || "Anónimo");
          statusText.innerText = "🔔 ¡Nueva nota de voz!";
          playBtn.disabled = false;
          playBtn.style.background = "#25D366"; // Color verde WhatsApp para avisar

          // 🔥 REPRODUCIR SONIDO DE ALERTA AQUÍ
          notificationSound.play().catch(e => {
            console.log("El navegador bloqueó la alerta sonora inicial hasta que interactúes con la pantalla.");
          });
        }
      } catch (e) {
        // Ignorar errores de red temporales
      }
    }, 4000);

    // Reproducir la nota de voz recibida
    playBtn.addEventListener('click', () => {
      if (lastAudioBase64) {
        const audio = new Audio(lastAudioBase64);
        statusText.innerText = "Reproduciendo audio...";
        playBtn.disabled = true;
        
        audio.play().catch(e => {
          alert("No se pudo reproducir automáticamente");
          playBtn.disabled = false;
        });
        
        audio.onended = () => {
          statusText.innerText = "Listo para hablar";
          playBtn.disabled = false;
        };
      }
    });
  </script>
 </body>
</html>
