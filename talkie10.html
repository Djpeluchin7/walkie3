<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMO PTT - Optimizado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .zello-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            width: 90%;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 0.75rem;
            color: #aaa;
            display: block;
            margin-bottom: 3px;
        }
        .user-input {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .ptt-button {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ff9800 0%, #e65100 100%);
            border: 6px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.1s, background 0.2s;
            margin: 15px 0 20px 0;
        }
        .ptt-button:active, .ptt-button.recording {
            transform: scale(0.95);
            background: radial-gradient(circle, #f44336 0%, #b71c1c 100%);
            box-shadow: 0 0 25px rgba(244, 67, 54, 0.8);
        }
        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #1976D2; }
        .action-btn.secondary { background-color: #444; }
        .action-btn.secondary:hover { background-color: #555; }
        
        .log-box {
            margin-top: 15px;
            width: 100%;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="zello-container">
        <div class="header">PRIMO PTT</div>
        <div class="status" id="statusText">Sistema listo</div>

        <!-- PANTALLA 1: LOGIN -->
        <div id="loginScreen" class="screen">
            <div class="input-group">
                <label>Nombre de Operador:</label>
                <input type="text" id="loginUsername" class="user-input" placeholder="Ej. Móvil_1">
            </div>

            <div class="input-group">
                <label>Canal (Contraseña):</label>
                <input type="password" id="loginPassword" class="user-input" placeholder="Canal">
            </div>

            <button class="action-btn" style="width: 90%; margin-top: 10px;" onclick="saveSession()">Conectar al Canal</button>
        </div>

        <!-- PANTALLA 2: RADIO -->
        <div id="radioScreen" class="screen hidden">
            <div style="font-size: 0.9rem; color: #ff9800; margin-bottom: 10px;">
                Conectado como: <span id="displayUser" style="font-weight: bold; color: #fff;"></span>
            </div>

            <button id="pttBtn" class="ptt-button">PTT</button>

            <div class="controls-row">
                <button class="action-btn" onclick="fetchLastAudio(true)">🔄 Forzar Escucha</button>
                <button class="action-btn secondary" onclick="logout()">Salir</button>
            </div>
        </div>

        <div class="log-box" id="logBox">Ingresa tus credenciales para comenzar.</div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXVLG-2mQU_mPYuGWbCkkQ6tueQnZcQYjdo9NXTkP9dzgzsIQwPkIIA3zQyMHAkj86QQ/exec"; 
        const SECRET_TOKEN = "Chavomiau"; 

        let mediaRecorder;
        let audioChunks = [];
        let sessionPassword = ""; 
        let pollInterval = null;
        let lastKnownAudioHash = ""; 

        const pttBtn = document.getElementById('pttBtn');
        const statusText = document.getElementById('statusText');
        const logBox = document.getElementById('logBox');

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.log("Audio bloqueado por navegador");
            }
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('zello_username');
            if (savedUser) {
                document.getElementById('loginUsername').value = savedUser;
            }
        };

        function saveSession() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                alert("Completa ambos campos.");
                return;
            }

            localStorage.setItem('zello_username', username);
            sessionPassword = password;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('radioScreen').classList.remove('hidden');
            document.getElementById('displayUser').innerText = username;
            statusText.innerText = "Escuchando canal en vivo...";
            logBox.innerText = "Canal seguro activo.";

            initMic();

            if (pollInterval) clearInterval(pollInterval);
            // Sondeo cada 4 segundos (óptimo para no saturar Apps Script)
            pollInterval = setInterval(() => {
                fetchLastAudio(false);
            }, 4000);
        }

        function logout() {
            if (pollInterval) clearInterval(pollInterval);
            sessionPassword = "";
            document.getElementById('loginPassword').value = "";
            document.getElementById('radioScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            statusText.innerText = "Sistema listo";
            logBox.innerText = "Sesión cerrada.";
        }

        function initMic() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        audioChunks = [];
                        
                        statusText.innerText = "Transmitiendo...";
                        logBox.indexes = "Enviando paquete de voz...";

                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async function () {
                            const base64Audio = reader.result;
                            const encryptedAudio = CryptoJS.AES.encrypt(base64Audio, sessionPassword).toString();
                            await sendAudioToServer(encryptedAudio);
                        }
                    };
                })
                .catch(error => {
                    statusText.innerText = "Error de Micrófono";
                    logBox.innerText = "Permiso denegado.";
                });
        }

        pttBtn.addEventListener('mousedown', startRecording);
        pttBtn.addEventListener('mouseup', stopRecording);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

        function startRecording() {
            if (!mediaRecorder || mediaRecorder.state === "recording") return;
            audioChunks = [];
            mediaRecorder.start();
            pttBtn.classList.add('recording');
            statusText.innerText = "🔴 TRANSMITIENDO...";
            logBox.innerText = "Hablando en el canal...";
        }

        function stopRecording() {
            if (!mediaRecorder || mediaRecorder.state !== "recording") return;
            mediaRecorder.stop();
            pttBtn.classList.remove('recording');
            statusText.innerText = "Procesando...";
        }

        async function sendAudioToServer(encryptedData) {
            const user = localStorage.getItem('zello_username') || "Anónimo";
            const payload = {
                token: SECRET_TOKEN,
                user: user,
                audio: encryptedData
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    statusText.innerText = "Escuchando canal en vivo...";
                    logBox.innerText = "Transmisión finalizada con éxito.";
                } else {
                    statusText.innerText = "Error de servidor";
                    logBox.innerText = result.message;
                }
            } catch (err) {
                statusText.innerText = "Error de red";
                logBox.innerText = "Comprueba tu conexión.";
            }
        }

        async function fetchLastAudio(isManual = false) {
            try {
                const response = await fetch(`${WEB_APP_URL}?token=${SECRET_TOKEN}`);
                const data = await response.json();

                if (data.status === "empty" || data.status === "error") {
                    return;
                }

                // Si es un audio nuevo distinto al que ya teníamos procesado
                if (data.audio !== lastKnownAudioHash) {
                    lastKnownAudioHash = data.audio;

                    try {
                        const bytes = CryptoJS.AES.decrypt(data.audio, sessionPassword);
                        const originalBase64Audio = bytes.toString(CryptoJS.enc.Utf8);

                        if (!originalBase64Audio.startsWith("data:audio")) {
                            return; // Ignorar en silencio si la contraseña no coincide (otro canal/grupo)
                        }

                        // Si envié yo mismo el mensaje, opcionalmente podemos evitar reproducirlo para no hacernos eco
                        const currentUser = localStorage.getItem('zello_username');
                        if (data.user === currentUser) {
                            return; 
                        }

                        playBeep(); // 🔊 Sonido tipo walkie-talkie
                        statusText.innerText = `🔊 Entrante: ${data.user}`;
                        logBox.innerText = "Reproduciendo mensaje...";

                        const audioPlayer = document.getElementById('audioPlayer');
                        audioPlayer.src = originalBase64Audio;
                        audioPlayer.play();

                        audioPlayer.onended = () => {
                            statusText.innerText = "Escuchando canal en vivo...";
                            logBox.innerText = "Canal activo.";
                        }

                    } catch (decryptError) {
                        // Error de descifrado silenciado
                    }
                } else if (isManual) {
                    logBox.innerText = "El canal está al día.";
                }

            } catch (err) {
                // Silenciar errores temporales de red para evitar spam en consola
            }
        }
    </script>
</body>
</html>
