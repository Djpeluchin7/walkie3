<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMO PTT - Optimizado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .zello-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            width: 90%;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 0.75rem;
            color: #aaa;
            display: block;
            margin-bottom: 3px;
        }
        .user-input {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .ptt-button {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ff9800 0%, #e65100 100%);
            border: 6px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.1s, background 0.2s;
            margin: 15px 0 20px 0;
        }
        .ptt-button:active, .ptt-button.recording {
            transform: scale(0.95);
            background: radial-gradient(circle, #f44336 0%, #b71c1c 100%);
            box-shadow: 0 0 25px rgba(244, 67, 54, 0.8);
        }
        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #1976D2; }
        .action-btn.secondary { background-color: #444; }
        .action-btn.secondary:hover { background-color: #555; }
        
        .log-box {
            margin-top: 15px;
            width: 100%;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="zello-container">
        <div class="header">PRIMO PTT</div>
        <div class="status" id="statusText">Sistema listo</div>

        <!-- PANTALLA 1: LOGIN -->
        <div id="loginScreen" class="screen">
            <div class="input-group">
                <label>Nombre de Operador:</label>
                <input type="text" id="loginUsername" class="user-input" placeholder="Ej. Móvil_1">
            </div>

            <div class="input-group">
                <label>Canal (Contraseña):</label>
                <input type="password" id="loginPassword" class="user-input" placeholder="Canal">
            </div>

            <button class="action-btn" style="width: 90%; margin-top: 10px;" onclick="saveSession()">Conectar al Canal</button>
        </div>

        <!-- PANTALLA 2: RADIO -->
        <div id="radioScreen" class="screen hidden">
            <div style="font-size: 0.9rem; color: #ff9800; margin-bottom: 10px;">
                Conectado como: <span id="displayUser" style="font-weight: bold; color: #fff;"></span>
            </div>

            <button id="pttBtn" class="ptt-button">PTT</button>

            <div class="controls-row">
                <button class="action-btn" onclick="fetchLastAudio(true)">🔄 Forzar Escucha</button>
                <button class="action-btn secondary" onclick="logout()">Salir</button>
            </div>
        </div>

        <div class="log-box" id="logBox">Ingresa tus credenciales para comenzar.</div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>
